<!DOCTYPE html>
<html>
<head>
    <title>Bloc Jams</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Open+Sans:400,800,600,700,300">
    <link rel="stylesheet" type="text/css" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css" integrity="sha384-4r9SMzlCiUSd92w9v1wROFY7DlBc5sDYaEBhcCJR7Pm2nuzIIGKVRtYWlf6w+GG4" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="styles/normalize.css">
    <link rel="stylesheet" type="text/css" href="styles/main.css">
    <link rel="stylesheet" type="text/css" href="styles/album.css">
    <link rel="stylesheet" type="text/css" href="styles/player_bar.css">
</head>
<body class="album">
    <nav class="navbar"> <!-- nav bar -->
        <a href="index.html"  class="logo">
            <img src="assets/images/bloc_jams_logo.png" alt="bloc jams logo">
        </a>
        <div class="links-container">
            <a href="collection.html" class="navbar-link">collection</a>
        </div>
    </nav>
    <main class="album-view container narrow">
    <section class="clearfix">
        <div class="column half">
            <img src="assets/images/album_covers/01.png" class="album-cover-art">
        </div>
        <div class="album-view-details column half">
            <h2 class="album-view-title">The Colors</h2>
            <h3 class="album-view-artist">Pablo Picasso</h3>
            <h5 class="album-view-release-info"></h5>
        </div>
    </section>
    <table class="album-view-song-list">
    
    </table>
    </main>
    <section class="player-bar">
        <div class="container">
            <div class="control-group main-controls">
                <button type="button" class="previous" aria-label="Previous song">
                    <span class="ion-skip-backward" aria-hidden="true"></span>
                </button>
                <button type="button" class="play-pause" aria-label="Play">
                    <span class="ion-play" aria-hidden="true"></span>
                </button>
                <button type="button" class="next" aria-label="Next song">
                    <span class="ion-skip-forward" aria-hidden="true"></span>
                </button>
            </div>
            <div class="control-group currently-playing">
                <h2 class="song-name"></h2>
                <div class="seek-control">
                    <div class="seek-bar" role="slider" tabindex="0" aria-label="Seek song position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div class="fill"></div>
                        <div class="thumb"></div>
                    </div>
                    <div class="current-time"></div>
                        <div class="total-time"></div>
                    </div>
                <h2 class="artist-song-mobile"></h2>
                <h3 class="artist-name"></h3>
            </div>
            <div class="control-group volume">
                <span class="ion-volume-high icon" aria-hidden="true"></span>
                <div class="seek-bar" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
                    <div class="fill"></div>
                    <div class="thumb"></div>
                </div>
            </div>
        </div>
    </section>
    <script type="module" src="scripts/album.js"></script>
</body>
